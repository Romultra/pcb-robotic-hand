; PlatformIO project — PCB1 validation firmware
; Target: custom board with ESP32-S3-WROOM-1-N8 (8 MB flash, no PSRAM)
; See journal/topics/board-architecture.md for the board this targets.

[env:pcb1]
platform        = espressif32@~6.7.0
board           = esp32-s3-devkitc-1
framework       = arduino

; Match the actual module: 8 MB flash, QIO, default partitioning
board_build.flash_size  = 8MB
board_build.flash_mode  = qio
board_build.partitions  = default_8MB.csv

; Native USB-CDC on GPIO19/20 (no UART bridge on this PCB).
; ARDUINO_USB_CDC_ON_BOOT=1 makes the boot console come out of the USB-CDC port.
; ARDUINO_USB_MODE=1 selects hardware-CDC (the ESP32-S3 native USB controller).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    ; Bigger Wi-Fi upload buffer: the WebServer hands the file body to the SD
    ; driver in HTTP_UPLOAD_BUFLEN pieces, so larger writes = fewer SD round
    ; trips and better throughput (4096 = 8 × 512-byte sectors). Default 1436.
    -DHTTP_UPLOAD_BUFLEN=4096

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed    = 921600

; Servos are driven straight off the ESP32-S3 LEDC peripheral (see
; src/drivers/servos.cpp) — ESP32Servo's auto channel allocation aliased pins on
; the S3, so it was dropped.
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.1
